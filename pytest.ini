[pytest]
# testpaths deliberately lists EVERY test directory, not just tests/.
#
# The old repo set `testpaths = tests`, so seven behavioural tests in
# `live/tests/` were never collected -- and two consolidation steps shipped a
# broken `live/` that stayed green because the only tests that would have
# caught it were invisible to the runner. tests/test_pytest_collection.py
# asserts this list stays complete, so a new test directory that nobody adds
# here fails a test instead of being silently skipped.
#
# Paths that do not exist yet are listed anyway: they are the directories an
# adopted module would land in, and a missing entry is the defect this line
# exists to prevent. pytest ignores non-existent testpaths entries.
testpaths =
    tests
    core/tests
    live/tests
    harness/tests
    tools/tests

# NOT `-q`. The old repo's pytest.ini set it, which suppressed the report
# header -- and that header carried a load-bearing caveat about what the
# orb_validator suite actually ran against. A default that hides the caveat is
# a default that gets someone eventually.
addopts = --strict-markers
