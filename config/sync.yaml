# One copier, N configured pairs. 026 part "Build it as a second configured
# pair, not a second script".
#
# Two copies of this logic WILL diverge, and the immutability rule below is
# subtle enough that having it implemented twice is exactly how one copy loses
# it. `tools/sync_from_drive.py` reads this file and has no pair-specific
# branches -- every difference between the two pairs is a value here.
#
# ONE WAY, ALWAYS. Nothing is ever written to, deleted from or renamed in a
# `from` folder. Those belong to Drive sync and to whoever authors into them; a
# file appearing there because this tool put it there would be
# indistinguishable from one the author wrote.
#
# NOTE THE SPACE in the regime folder name -- `...-from scheduled`. Paths are
# read as YAML strings and never word-split, but an unquoted path in any shell
# wrapper fails in a way that looks like an EMPTY FOLDER rather than an error.

pairs:
  # 025's pair. Configured here because 026 specifies one copier with both
  # pairs, and writing the second script is the thing 026 exists to prevent.
  # **Not yet exercised** -- 025 owns the gap analysis, the `git check-ignore`
  # assertion and the daily wiring, and none of that is done. See 026's
  # done-note.
  - id:     regime_snapshots
    from:  'D:\claude-googledrive-sync\momentum-regime-snapshots-from scheduled'
    to:    'D:\Dev\momentum\docs\regime-snapshots'
    glob:  '*.md'
    checks: []

  # 026's pair.
  - id:     handoff_inbox
    from:  'D:\claude-googledrive-sync\momentum-inbox-handoff'
    to:    'D:\Dev\momentum\handoff\inbox'
    glob:  '*.md'
    # Both checks are 026's and belong to THIS pair only. They are listed as
    # values rather than hardcoded against `id == "handoff_inbox"`, so the
    # copier keeps having no pair-specific branches.
    checks:
      - filename_convention   # NNN-for-code-*.md -- copy anyway, but name it
      - number_collision      # same NNN, different name -- copy neither

  # 043's pair. **The rule that no Claude writes to `christoph/` is amended
  # NARROWLY, and only this half.**
  #
  # `christoph/open/` files are AUTHORED BY THE DESIGN SESSION -- they are its
  # task files for Christoph. There was never an authorship conflict there, only
  # a placement convention that cost a manual copy on every UAT. The rule existed
  # because of a limit and the limit has lifted, which is the same reasoning that
  # retired the download-and-copy step for `handoff/inbox/`.
  #
  # **`christoph/done/` is Christoph's ANSWERS and does not change. Nothing
  # writes into it, by any channel, ever.** It is copy-verify-retire and he
  # performs it. `tests/test_sync_never_targets_christoph_done.py` fails on any
  # configured pair whose destination lands inside it -- because a lock that is
  # only a sentence in a document is not a lock.
  #
  # `filename_convention` and `number_collision` are 026's and belong to the
  # handoff pair: they encode `NNN-for-code-*.md`, which is the naming for
  # files addressed to Claude Code. `christoph/open/` uses `NNN-*.md`
  # addressed to a person, and a convention check calibrated on one audience
  # would flag every correct file in the other. Neither applies here.
  #
  # **`suppress_retired` (069 Part A) does, and only here.** `christoph/open/`
  # is copy-verify-retire -- the file LEAVES the destination when Christoph is
  # done with it -- and the Drive source still holds it, so the copier's one
  # rule (`not in the destination -> copy it`) resurrected every retired item,
  # forever: `c032`, `c035` and `c036` came back three times each. `pairs 1
  # and 2 (regime_snapshots, handoff_inbox) are copy-and-keep -- nothing ever
  # leaves them, so this check does not apply and must not be added there.
  - id:     christoph_open
    from:  'D:\claude-googledrive-sync\momentum-christoph-open'
    to:    'D:\Dev\momentum\christoph\open'
    glob:  '*.md'
    checks:
      - suppress_retired   # a source file already in the sibling done/ is not copied
